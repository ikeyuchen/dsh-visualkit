name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# 一次只跑一个发布；取消旧发布会留下"发到一半"的风险，所以不做 cancel-in-progress。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # 发布在 windows 上跑：ubuntu 会跳过 80 多项像素/渲染用例，而那些用例正是
    # 这个包最容易坏的部分。代价是作业慢约 1 分钟，发布频率低，可以接受。
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # 手动触发只能从 tag 发起：在分支上跑时 GITHUB_REF_NAME 是分支名，
      # 后面的版本一致性校验必然失败，这里提前给出准确原因。
      - name: Require tag ref
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "release 只能从 tag 触发（当前 ref=$GITHUB_REF）" >&2
          exit 1

      # win32 与 package.json 的 os/cpu 匹配，不需要 ubuntu 上的 --force。
      - run: npm ci

      # tag 与 package.json 版本必须一致，避免「打了 v0.2.0 却发 0.1.0」
      - name: Version matches tag
        shell: bash
        run: |
          node -e "
          const p = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (p.version !== tag) { console.error('tag ' + tag + ' ≠ package.json ' + p.version); process.exit(1); }
          console.log('✓ version ' + p.version + ' matches tag');
          "

      # 发布前的测试与静态检查由 prepublishOnly（release:check && npm test）执行，只跑一次：
      # 2026-11 之前这里另有一道显式 npm test，等于同一套用例跑两遍。
      # 版本号带 -beta/-rc 等后缀 → 发 npm 的 beta 通道；否则发 latest。
      - name: Publish
        shell: bash
        run: |
          TAG=latest
          case "$(node -p "require('./package.json').version")" in
            *-*) TAG=beta ;;
          esac
          echo "publishing with --tag $TAG"
          npm publish --access public --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

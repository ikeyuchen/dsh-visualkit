name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只读仓库，不需要写任何东西。
permissions:
  contents: read

# 同一 ref 的新推送取消旧 run：连续推送不再各跑一遍完整套件。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 三个作业并行：
#   Test (windows-latest)  全量用例（像素/渲染用例只在 win32 可执行），跑覆盖率门禁，并上传渲染产物
#   Test (ubuntu-latest)   同一套用例（像素用例自标 skip），跑静态发布检查
#   Package metadata       包元数据与 locale 标题
#
# 为什么 ubuntu 不跳过整个作业：纯 JS 部分（图标/滤镜/风格/素材/打包边界）一样能跑，
# 能提前发现路径大小写与 symlink 差异。渲染用例用 { skip: !CAN_RENDER } 自标。
#
# 覆盖率门禁放在 windows：ubuntu 会跳过渲染与位图相关用例，render.js / taste-image.js /
# diff.js / layouts-png.js 只剩 12–37%，分母与阈值都不具可比性。windows 上是全量口径，
# 阈值按该结果校准（行 94 / 分支 86 / 函数 93）。windows 作业直接用 test:coverage
# 一次跑完用例与覆盖率，不再重复跑一遍 npm test。
#
# action 固定到 commit SHA（尾部注释记版本号，dependabot 会按注释跟进）。

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # 根包声明了 os:["win32"]（vendored resvg 只有 win32-x64 绑定），
      # 在 ubuntu 上 npm ci 会因平台不匹配直接 EBADPLATFORM；--force 只跳过这条平台检查。
      - run: npm ci --force
      - name: Run functional test suite
        if: matrix.os == 'ubuntu-latest'
        run: npm test
      - name: Static release checks (version / budget / pack whitelist)
        if: matrix.os == 'ubuntu-latest'
        run: npm run release:check
      # 一次跑完用例与覆盖率（node --test 自带覆盖率），不再单独跑一条 npm test。
      - name: Run functional test suite + coverage gate (lines 94 / branches 86 / functions 93)
        if: matrix.os == 'windows-latest'
        run: npm run test:coverage
      # .test-out 是隐藏目录：不打开 include-hidden-files 就永远"没有文件可传"。
      # 这里故意用 if-no-files-found: error——渲染用例哪天不再产出 PNG，CI 要立刻红。
      - name: Upload rendered artifacts (visual review)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: render-artifacts
          path: .test-out/*.png
          include-hidden-files: true
          if-no-files-found: error

  metadata:
    name: Package metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: package.json metadata sanity
        run: |
          node -e "
          const p = require('./package.json');
          const need = ['name','version','description','license','repository','homepage','bugs','publishConfig','files','engines','peerDependencies'];
          const miss = need.filter((k) => !p[k]);
          if (miss.length) { console.error('package.json 缺字段:', miss.join(', ')); process.exit(1); }
          if (p.publishConfig.access !== 'public') { console.error('publishConfig.access 必须是 public'); process.exit(1); }
          if (!p.dsh?.manifestVersion) { console.error('缺少 dsh.manifestVersion'); process.exit(1); }
          if (Object.keys(p.dependencies ?? {}).length > 0) { console.error('不允许运行时依赖'); process.exit(1); }
          if (!p.scripts?.test?.includes('node --test')) { console.error('test 脚本必须指向 node --test 套件'); process.exit(1); }
          console.log('✓ package.json 元数据完整');
          "
      - name: locale titles present
        run: |
          node -e "
          for (const l of ['zh','en']) {
            const j = require('./locale/' + l + '.json');
            if (!j.meta?.title) { console.error(l + ' 缺 meta.title'); process.exit(1); }
            console.log('✓ ' + l + ': ' + j.meta.title);
          }
          "

name: Feature request
description: 提议一个新能力或改进 / Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本包的定位是**视觉设计的工艺层**：取真资产 → 定规格 → 量审美 → 出成品，核心能力离线自包含。
        与该定位无关的请求（如 AI 绘图生成、PSD 深度编辑）通常不会接受。
  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题 / The problem
      description: 先说你现在卡在哪，再说设想的做法
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法 / Proposed approach
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一层 / Which layer
      options:
        - 图标数据与检索
        - 形变引擎
        - AI 味规则与评分
        - 风格预设（皮肤 / 骨架）
        - 渲染与合成
        - 素材库
        - 文档与工程
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认 / Constraints
      options:
        - label: 方案不需要 Python / Krita / Playwright 等外部程序
          required: true
        - label: 接受新增数据文件会增大包体积（当前约 15 MB）

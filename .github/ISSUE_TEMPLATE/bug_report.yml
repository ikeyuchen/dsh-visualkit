name: Bug report
description: 报告一个可复现的问题 / Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：`npm run check` 是否通过、DSH 版本是否在 `engines.dsh` 范围内。
        Please confirm `npm run check` passes and your DSH version is within `engines.dsh`.
  - type: dropdown
    id: tool
    attributes:
      label: 受影响的工具 / Affected tool
      options:
        - icon (find / emit)
        - morph (check / preview)
        - taste_check (taste / audit)
        - design_style
        - design_render (render / composite / asset)
        - 插件加载 / plugin loading
        - 其他 / other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 贴出工具调用参数与完整输出（敏感路径可打码）
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期待什么 / What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本 / Versions
      description: "dsh-visualkit / DSH / 操作系统（如 0.1.0 / 0.2.2-rc.1 / Windows 11 x64）"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 已确认 / Checklist
      options:
        - label: 已运行 `npm run check` 且通过
          required: true
        - label: 已搜索过现有 issue
          required: true
